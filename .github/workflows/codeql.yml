name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC

permissions:
  security-events: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet/shared/Microsoft.AspNetCore.App/6.* \
                      /usr/share/dotnet/shared/Microsoft.AspNetCore.App/7.* \
                      /usr/share/dotnet/shared/Microsoft.NETCore.App/6.* \
                      /usr/share/dotnet/shared/Microsoft.NETCore.App/7.* \
                      /usr/local/lib/android \
                      /opt/ghc || true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # actions: the workflows and the composite actions under templates/github-actions/, whose default
          # queries found nothing on 2026-09-29 (plans/PR_REPORT_LINK_PLAN.md §10).
          languages: csharp, actions

      - name: Restore
        run: dotnet restore release.slnf

      - name: Build
        run: dotnet build release.slnf --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
