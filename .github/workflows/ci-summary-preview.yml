name: CI Summary Preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci-preview:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Counts are from the committed sources. They said 10/10/5-pass-5-fail from the 3.0.0 rebrand
          # until 3.2.0 and had been wrong the whole time.
          - name: "CI Preview — All Passing (11 tests)"
            project: examples/Example.Api/tests/Example.Api.Tests.CiPreview.AllPassing
          - name: "CI Preview — All Failing (11 tests)"
            project: examples/Example.Api/tests/Example.Api.Tests.CiPreview.AllFailing
          - name: "CI Preview — Mixed (5 pass, 15 fail)"
            project: examples/Example.Api/tests/Example.Api.Tests.CiPreview.Mixed
          # The only fixture in the repository that fails INSIDE a step, which is the only shape that can
          # populate the digest's calls table. Everything else with failures is step-less.
          - name: "CI Preview — Failing Inside a Step (1 pass, 5 fail)"
            project: examples/Example.Api/tests/Example.Api.Tests.CiPreview.FailingWithSteps
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Cross-run history, dogfooded through the action in templates/github-actions/kronikol-history
      # (plans/HISTORY_ACTION_PLAN.md S4), called by path so every push to main runs the action as it stands. The
      # ledger lives on the orphan data branch `kronikol-history`, read before the run so the reports these jobs
      # write carry the verdicts; each job saves its fragment, and the `history` job folds them all. The tool is
      # built from this commit, so the gate and the fold run the code under test.
      - uses: ./templates/github-actions/kronikol-history/read

      - name: Build & Test
        id: test
        continue-on-error: true
        env:
          PROJECT: ${{ matrix.project }}
        run: dotnet test "$PROJECT" --configuration Release --verbosity normal

      - name: Build the tool
        if: ${{ !cancelled() }}
        run: dotnet build src/Kronikol.Tool/Kronikol.Tool.csproj --configuration Release --framework net10.0

      - uses: ./templates/github-actions/kronikol-history/gate
        if: ${{ !cancelled() }}
        with:
          reports: ${{ matrix.project }}/bin/Release/net10.0/Reports
          test-outcome: ${{ steps.test.outcome }}
          tool-command: dotnet run --no-build --project src/Kronikol.Tool/Kronikol.Tool.csproj --framework net10.0 --configuration Release --

      - uses: ./templates/github-actions/kronikol-history/save
        if: ${{ !cancelled() }}
        with:
          path: ${{ matrix.project }}

  history:
    name: Record the runs in the history ledger
    needs: ci-preview
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build the tool
        run: dotnet build src/Kronikol.Tool/Kronikol.Tool.csproj --configuration Release --framework net10.0

      # One line per run and suite, one commit per workflow run, and a push that another run's push beat records
      # again on the branch as it now is. Its job summary shows the ledger for each suite recorded.
      - uses: ./templates/github-actions/kronikol-history/record
        with:
          tool-command: dotnet run --no-build --project src/Kronikol.Tool/Kronikol.Tool.csproj --framework net10.0 --configuration Release --
