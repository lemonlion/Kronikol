name: PR report link

# Runs the kronikol-pr-report-link action for real, on the pull requests that change it or the chain it links: the
# project this lane tests, and the code that writes the reports-path output the upload reads. The in-memory GitHub
# of PrReportLinkActionTests cannot hold permissions, the bot's identity, re-runs or concurrency. Not a required
# check: a workflow its paths filter skips never reports, and a required check would wait for it.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'templates/github-actions/kronikol-pr-report-link/**'
      - '.github/workflows/pr-report-link.yml'
      - 'examples/Example.Api/tests/Example.Api.Tests.CiPreview.AllPassing/**'
      - 'src/Kronikol/Reports/CiArtifactPublisher.cs'

permissions:
  contents: read

jobs:
  test:
    name: CI Preview, with its reports uploaded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        id: test
        run: dotnet test examples/Example.Api/tests/Example.Api.Tests.CiPreview.AllPassing --configuration Release

      # `error`, where the README's example says `ignore`: here a reports path that went missing must fail the lane.
      - name: Upload the Kronikol reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-preview-reports
          path: ${{ steps.test.outputs.reports-path }}
          retention-days: ${{ steps.test.outputs.reports-retention-days }}
          if-no-files-found: error

  report-link:
    name: Link the Kronikol report on the PR
    needs: [test]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: kronikol-report-link-${{ github.event.pull_request.number }}
      queue: max
    steps:
      # The checkout form, not `$/`, because this lane proves what the README tells a consumer to copy.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: templates/github-actions

      - uses: ./templates/github-actions/kronikol-pr-report-link
        with:
          artifact-name: ci-preview-reports
          label: CI Preview (all passing)

      # The action only warns when it finds nothing to link, so without this step the lane would pass while the
      # comment went stale. It reads the comment back: the line must link this run's newest upload, unless a newer
      # run has already linked the report.
      - name: Check the comment links this run's report
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: ci-preview-reports
        with:
          script: |
            const name = process.env.ARTIFACT_NAME;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: context.payload.pull_request.number, per_page: 100,
            });
            const comment = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith('<!-- kronikol-report-link -->'));
            const tag = `<!-- kronikol-report-link:${name} run:`;
            const line = comment?.body.split(/\r?\n/).find(l => l.startsWith('- ') && l.includes(tag));
            if (!line) {
              core.setFailed(`The pull request's report comment has no line for ${name}.`);
              return;
            }
            const run = Number(line.slice(line.indexOf(tag) + tag.length).match(/^\d+/)?.[0] ?? 0);
            if (run > context.runId) {
              core.info(`Run ${run} is newer and linked ${name}, so this run's line was rightly left alone.`);
              return;
            }
            if (run < context.runId) {
              core.setFailed(`The line for ${name} still links run ${run}, not this run, ${context.runId}.`);
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: context.runId, name, per_page: 100,
            });
            const newest = artifacts
              .filter(a => !a.expired)
              .sort((a, b) => (Date.parse(b.created_at) || 0) - (Date.parse(a.created_at) || 0))[0];
            if (!newest) {
              core.setFailed(`This run's ${name} has expired, so the line links a download that is gone: ${line}`);
              return;
            }
            if (!line.includes(`/actions/runs/${context.runId}/artifacts/${newest.id})`)) {
              core.setFailed(`The line for ${name} does not link this run's newest upload, ${newest.id}: ${line}`);
              return;
            }
            core.info(`The comment links this run's ${name}: ${line}`);
