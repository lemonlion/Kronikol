<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>one CDN script</title></head>
<body><p>One script from cdn.jsdelivr.net, added before load as the render script adds the engine.</p>
<script>
var s = document.createElement('script');
s.src = 'https://cdn.jsdelivr.net/npm/fzstd@0.1.1/umd/index.js';
s.onload = function () { window.__scriptLoaded = performance.now(); };
document.head.appendChild(s);
</script>
</body></html>
