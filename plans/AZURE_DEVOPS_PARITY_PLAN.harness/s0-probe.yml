# S0 of plans/AZURE_DEVOPS_PARITY_PLAN.md: every Azure Pipelines claim the plan rests on that could not be
# run without an Azure DevOps organisation, exercised in one throwaway pipeline. Each step is named after
# the ledger row (§9) it settles; write what each printed into results-s0.txt beside this file. The history
# scripts themselves are not here: record_script.sh already runs them against a git server that behaves as
# both forges' git endpoints do. What is here is what only the service can answer.
#
# How to run it (about half a day, most of it waiting and reading):
#   1. A scratch project in any organisation. Import this repository into its Azure Repos, or commit this
#      file alone to a scratch repository; the pipeline needs nothing else from the checkout.
#   2. Create a pipeline from this file. Leave the build identity's repository permissions at their
#      defaults for the first run: A12 records what the default identity is refused.
#   3. Queue it. Shard a fails its first attempt on purpose (A10).
#   4. On the finished run, "Rerun failed jobs" on stage probe. Record which jobs ran again (the fold job, a
#      dependent in the same stage), whether stage after ran again (a dependent stage), and what A2, A7 and
#      A8 printed on the second attempt (A10).
#   5. Grant the build identity Contribute on the repository (then, for A13, on the probe branch only) and
#      queue it again: A12 should push.
#   6. Open a pull request against main with a build-validation policy running this pipeline: A2 prints the
#      pull-request variables (A5, A26).
#   7. For A14: in a second pipeline whose YAML has no trigger section (every branch triggers), push three
#      commits to the probe branch, one with [skip ci] in its message, one with ***NO_CI***, one with
#      neither; record which queued a run.
#   8. The same file in a GitHub repository connected through the Azure Pipelines app, runs 3 to 6 again:
#      A5's target-branch format, and whether the app's token (set persistCredentials on a checkout and read
#      it back) can push, for §4.6.
#   9. On the pull-request build of step 6, A21 posts one iteration status and one thread with the build
#      identity: record whether each is refused, which iteration the status landed on, and what the pull
#      request shows. Push once more to the pull request while that build runs, to see an older build's
#      status on an older iteration.
#  10. Once on windows-latest (pool below): A20 records which bash a `bash` step runs there.
# Nothing here reads a secret. The one token, System.AccessToken, is mapped into the A11, A12 and A21 steps
# only. Delete the branch kronikol-history-probe afterwards.

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  PROBE_BRANCH: kronikol-history-probe

stages:
- stage: probe
  jobs:
  - job: shard
    strategy:
      matrix:
        a: { SHARD: a }
        b: { SHARD: b }
    steps:
    - checkout: self
      # A1 runs once with this line removed: the fetch depth a new pipeline gets by default.
      fetchDepth: 1

    - bash: env | sort | grep -E '^(TF_BUILD|BUILD_|SYSTEM_|AGENT_JOB|AGENT_OS|PIPELINE_)' | grep -v -i -E 'token|secret'
      displayName: 'A2 A5 A26 F11 the predefined variables: attempts, pull-request target and source commit, both server URIs'

    - bash: |
        uname -a
        echo "running: $BASH $BASH_VERSION"
        type -a bash
        command -v git
        git --version
      displayName: 'A20 which bash and which git a bash step runs (Git Bash expected on Windows; 3.2 on macOS)'

    - bash: |
        echo "some text first ##vso[task.setvariable variable=PROBE_MIDLINE]set-from-mid-line"
        echo "   ##vso[task.setvariable variable=PROBE_INDENTED]set-after-whitespace"
        echo "##vso[task.setvariable variable=PROBE_LINESTART]set-from-line-start"
      displayName: 'A3 is a logging command acted on mid-line, or only at the start of a line?'
    - bash: echo "mid-line=${PROBE_MIDLINE:-unset} indented=${PROBE_INDENTED:-unset} line-start=${PROBE_LINESTART:-unset}"
      displayName: 'A3 read back'

    - bash: |
        f="$(Agent.TempDirectory)/CiSummary.md"
        cat > "$f" <<'MARKDOWN'
        # Probe summary

        | Metric | Value |
        |---|---|
        | Status | ❌ Failed |

        <details><summary>❌ <strong>A collapsed block</strong></summary>

        Text inside the collapsed block.

        </details>

        <details open><summary>An open block</summary>

        ![diagram](https://plantuml.com/plantuml/svg/SoWkIImgAStDuNBAJrBGjLDmpCbCJbMmKiX8pSd9vt98pKi1IW80)

        </details>

        ```mermaid
        sequenceDiagram
          autonumber
          Test->>Api: POST /orders
          Api-->>Test: 201 Created
        ```

        ```bash
        kronikol query failures ./Reports
        ```

        > [!TIP]
        > A GitHub alert block.
        MARKDOWN
        echo "##vso[task.uploadsummary]$f"
        echo "##vso[task.uploadsummary]$f"
        echo "##vso[task.addattachment type=Distributedtask.Core.Summary;name=Kronikol probe $SHARD]$f"
      displayName: 'A4 what the Extensions tab renders, how it titles a section, and one file posted twice by one step'
    - bash: echo "##vso[task.uploadsummary]$(Agent.TempDirectory)/CiSummary.md"
      displayName: 'A4 the same file posted again, from a second step (a second timeline record)'

    - bash: |
        echo "##vso[task.uploadsummary]$(Agent.TempDirectory)/CiSummary.md"
        echo "##vso[artifact.upload containerfolder=Restricted;artifactname=Restricted]$(Agent.TempDirectory)/CiSummary.md"
        echo "##vso[task.setvariable variable=PROBE_RESTRICTED]set"
        echo "##vso[task.logissue type=warning]A28 a warning from a restricted step"
      displayName: 'A28 A9 restricted mode: which of these land, what it logs, and whether the step turns orange'
      target:
        commands: restricted
        settableVariables: none
    - bash: echo "PROBE_RESTRICTED=${PROBE_RESTRICTED:-unset}"
      displayName: 'A28 read back'

    - bash: echo "##vso[task.logissue type=warning]A9 a warning annotation from shard $SHARD"
      displayName: 'A9 where a warning annotation surfaces'

    - bash: |
        mkdir -p "$(Agent.TempDirectory)/reports"
        echo "shard $SHARD, job attempt $(System.JobAttempt)" > "$(Agent.TempDirectory)/reports/TestRunReport.html"
        echo "##vso[artifact.upload containerfolder=TestReports;artifactname=TestReports]$(Agent.TempDirectory)/reports/TestRunReport.html"
      displayName: 'A7 both shards, and a re-run, upload into one container artifact name (what CiArtifactName does today)'

    - publish: $(Agent.TempDirectory)/reports
      artifact: probe-reports-$(System.JobName)
      condition: succeededOrFailed()
      displayName: 'A8 a pipeline artifact name the re-run of this job publishes again'

    - bash: |
        repo="$(Agent.TempDirectory)/probe-read"
        git init -q --bare "$repo"
        git -C "$repo" -c http.extraheader="AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" ls-remote --exit-code "$(Build.Repository.Uri)" "refs/heads/$PROBE_BRANCH"
        echo "ls-remote exit $? (0: the branch exists, 2: it does not)"
        git config --get-regexp 'http.*extraheader' || echo "no credential persisted in the checkout (expected: persistCredentials is off)"
      displayName: 'A11 read a data branch from a repository of its own, with a step-scoped token'
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

    - bash: |
        if [ "$SHARD" = a ] && [ "$(System.JobAttempt)" = 1 ]; then
          echo "shard a fails its first attempt on purpose"
          exit 1
        fi
      displayName: 'A10 fail the first attempt of shard a'

    - bash: |
        set -u
        api="$(System.CollectionUri)$(System.TeamProjectId)/_apis/git/repositories/$(Build.Repository.ID)/pullRequests/$(System.PullRequest.PullRequestId)"
        auth="Authorization: Bearer $SYSTEM_ACCESSTOKEN"
        curl -sS -H "$auth" "$api/iterations?api-version=7.1" > "$(Agent.TempDirectory)/iterations.json"
        latest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["value"][-1]["id"])' "$(Agent.TempDirectory)/iterations.json")
        iteration=$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))["value"]; m=[i["id"] for i in v if i.get("sourceRefCommit",{}).get("commitId")==sys.argv[2]]; print(m[-1] if m else "none")' \
          "$(Agent.TempDirectory)/iterations.json" "$(System.PullRequest.SourceCommitId)")
        echo "latest iteration $latest; the iteration whose source commit this build ran: $iteration"
        curl -sS -o /dev/null -w "iteration status: HTTP %{http_code}\n" -H "$auth" -H "Content-Type: application/json" \
          -d '{"state":"succeeded","description":"Kronikol probe: 2 scenarios, 0 failed","context":{"name":"probe-'"$SHARD"'","genre":"kronikol"},"targetUrl":"$(System.CollectionUri)$(System.TeamProjectId)/_build/results?buildId=$(Build.BuildId)&view=artifacts&pathAsName=false&type=publishedArtifacts"}' \
          "$api/iterations/$iteration/statuses?api-version=7.1"
        curl -sS -o /dev/null -w "thread: HTTP %{http_code}\n" -H "$auth" -H "Content-Type: application/json" \
          -d '{"comments":[{"parentCommentId":0,"content":"Kronikol probe thread from shard '"$SHARD"'","commentType":1}],"status":"closed","properties":{"kronikol":"probe"}}' \
          "$api/threads?api-version=7.1"
      displayName: 'A21 A26 the build identity posts an iteration status (to its own iteration) and a thread (pull-request builds only)'
      condition: eq(variables['Build.Reason'], 'PullRequest')
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - job: fold
    dependsOn: shard
    condition: succeededOrFailed()
    steps:
    - checkout: none
    - bash: |
        echo "fold: job attempt $(System.JobAttempt), stage attempt $(System.StageAttempt)"
        echo "Build.Repository.Uri in a job with checkout: none: $(Build.Repository.Uri)"
        repo="$(Agent.TempDirectory)/probe-ledger"
        auth=(-c "http.extraheader=AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN")
        git init -q "$repo"
        git -C "$repo" symbolic-ref HEAD "refs/heads/$PROBE_BRANCH"
        git -C "$repo" remote add origin "$(Build.Repository.Uri)"
        git -C "$repo" config user.name "Kronikol probe"
        git -C "$repo" config user.email "probe@example.invalid"
        git -C "$repo" "${auth[@]}" ls-remote --exit-code origin "refs/heads/$PROBE_BRANCH" > /dev/null
        found=$?
        echo "ls-remote exit $found (0: the branch exists, 2: it does not)"
        if [ "$found" -eq 0 ]; then
          git -C "$repo" "${auth[@]}" fetch -q --depth=1 origin "+refs/heads/$PROBE_BRANCH:refs/remotes/origin/$PROBE_BRANCH"
          git -C "$repo" reset -q --hard "refs/remotes/origin/$PROBE_BRANCH"
        fi
        echo "build $(Build.BuildId), fold job attempt $(System.JobAttempt)" >> "$repo/probe.txt"
        git -C "$repo" add -A
        git -C "$repo" commit -q -m "Probe $(Build.BuildId):$(System.JobAttempt) [skip ci]"
        if git -C "$repo" "${auth[@]}" push origin "HEAD:refs/heads/$PROBE_BRANCH"; then
          echo "pushed"
        else
          echo "push refused: record the message above, it names the missing permission"
        fi
      displayName: 'A12 A13 A14 the scripts'' git shape with the build identity: a repository of its own, ls-remote, a depth-1 fetch, [skip ci], a push'
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- stage: after
  dependsOn: probe
  condition: succeededOrFailed()
  jobs:
  - job: after
    steps:
    - checkout: none
    - bash: |
        echo "stage after: job attempt $(System.JobAttempt), stage attempt $(System.StageAttempt)"
      displayName: 'A10 a stage that depends on stage probe: does "Rerun failed jobs" there run it again?'
