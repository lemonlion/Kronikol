# Tempo single binary with the metrics generator's service graph processor at its defaults, its wait shortened.
stream_over_http_enabled: true
server:
  http_listen_port: 23200
  grpc_listen_port: 29095

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:34318

ingester:
  max_block_duration: 5m

metrics_generator:
  # A span that ended more than this long ago is discarded, 30 s by default. The payload's times are when it was generated.
  metrics_ingestion_time_range_slack: 1h
  processor:
    service_graphs:
      wait: 1s
      enable_virtual_node_label: true
  registry:
    collection_interval: 2s
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://127.0.0.1:29090/api/v1/write

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs]
      collection_interval: 2s
